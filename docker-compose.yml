version: '3.8'
services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "${DB_PORT}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${DB_USER}"
      MONGO_INITDB_ROOT_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - mongo-db:/data/db
      - mongo-db-config:/data/configdb

volumes:
  mongo-db:
    name: mongo-db
  mongo-db-config:
    name: mongo-db-config